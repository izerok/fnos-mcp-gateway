name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (pyflakes)
        run: ruff check --select F src/ tests/
      - name: Tests
        env:
          FNOS_FAKE_STATE_FILE: /tmp/fnos-fake-state.json
        run: pytest -q
