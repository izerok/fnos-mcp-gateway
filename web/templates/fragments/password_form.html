<div class="kicker">面板安全</div>
<h3 id="adminTitle">修改管理员密码</h3>
<p class="sub">修改后所有已登录的浏览器会话立即失效，需要重新登录。</p>

{% if error %}<div class="inline-error" role="alert"><p>{{ error }}</p></div>{% endif %}

<form class="password-form" autocomplete="off"
      hx-post="/api/panel/password" hx-target="#adminModalBody" hx-swap="innerHTML">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="currentPassword">当前密码</label>
  <input id="currentPassword" name="current_password" type="password"
         autocomplete="current-password" required>

  <label for="newPassword">新密码</label>
  <input id="newPassword" name="password" type="password"
         autocomplete="new-password" minlength="8" maxlength="128" required>
  {% if errors.password %}<p class="field-error" role="alert">{{ errors.password }}</p>{% endif %}

  <label for="newPassword2">确认新密码</label>
  <input id="newPassword2" name="password_confirm" type="password"
         autocomplete="new-password" minlength="8" maxlength="128" required>
  {% if errors.confirm %}<p class="field-error" role="alert">{{ errors.confirm }}</p>{% endif %}

  <div class="actions form-actions">
    <button class="btn primary" type="submit">保存新密码</button>
    <button class="btn" type="button" data-close="admin">取消</button>
  </div>
</form>
