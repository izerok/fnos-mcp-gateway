<div class="kicker">登录 {{ profile.name }}</div>
<h3 id="loginTitle">在浏览器中授权</h3>
<p>打开下面的链接，用 NAS 账号登录并确认授权。完成后页面会显示一个 5 分钟有效的一次性 code。</p>
<p class="url-box mono">{{ url }}</p>
<p class="sub">目标：{{ profile.target }}</p>
<div class="actions">
  <a class="btn primary" href="{{ url }}" target="_blank" rel="noopener noreferrer">打开授权页</a>
  <button class="btn" id="copyAuthBtn" type="button" data-url="{{ url }}">复制链接</button>
  <button class="btn" id="toCodeBtn" type="button">我已授权，填写 code</button>
</div>
<div id="loginStep2" hidden>
  <p>把 NAS 授权页显示的一次性 code 填在这里。code 只提交给服务端，不保存在浏览器。</p>
  <form hx-post="/api/profiles/{{ profile.name }}/login/finish" hx-target="#rows" hx-swap="innerHTML" hx-indicator="#submitCodeBtn">
    <label for="codeInput">一次性 code</label>
    <input id="codeInput" name="code" type="text" autocomplete="one-time-code" maxlength="64" placeholder="粘贴授权页显示的一次性 code">
    <div id="loginError" class="inline-error" role="alert" hidden><p>授权码无效或已过期，请重新发起授权。</p></div>
    <div class="actions">
      <button class="btn primary" id="submitCodeBtn" type="submit" disabled>提交 code</button>
      <button class="btn" id="backToStep1" type="button">返回授权链接</button>
    </div>
  </form>
  <p class="footnote">code 5 分钟内有效。登录失败就重新发起授权，不重试旧 code。</p>
</div>
